<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>使用统计 · 埋点数据查询终端</title>
    <script src="/assets/date-range-picker.js"></script>
    <style>
      :root{--void:#070908;--surface:#0b0e0c;--ink:#f0f2ec;--soft:#b7bdb5;--muted:#727a73;--line:#252a26;--line-strong:#3b423c;--mint:#9bf2c7;--amber:#f2c36b;--danger:#ff8c82;--mono:"Cascadia Code","IBM Plex Mono",Consolas,monospace;--display:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:var(--mono);background:radial-gradient(circle at 14% -20%,rgba(155,242,199,.09),transparent 38rem),linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px),var(--void);background-size:auto,28px 28px,28px 28px,auto}.shell{width:min(1380px,calc(100% - 40px));margin:auto;padding:20px 0 48px}
      .topbar,.panel-head{display:flex;align-items:center;min-height:46px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.brand{color:var(--ink);font-weight:700;letter-spacing:.14em}.spacer{flex:1}.chip{margin-left:16px;padding:7px 10px;border:1px solid var(--line)}a{color:var(--mint);text-decoration:none}
      .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:48px 0 28px}.kicker{margin-bottom:12px;color:var(--mint);font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:500 clamp(34px,4.5vw,62px)/1.08 var(--display);letter-spacing:-.04em}.intro p{max-width:390px;margin:0;color:var(--muted);font:13px/1.8 var(--display)}
      .panel{margin-top:16px;border:1px solid var(--line-strong);background:rgba(8,11,9,.9)}.panel-head{padding:0 18px;gap:12px}.panel-head strong{color:var(--ink);font-weight:500}.panel-head .push{margin-left:auto}.panel-body{padding:24px;overflow-x:auto}
      .kpis{display:grid;grid-template-columns:repeat(4,1fr) minmax(290px,1.45fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:16px}.kpi{min-height:112px;padding:20px;background:var(--surface)}.kpi span{color:var(--muted);font:10px/1.4 var(--mono)}.kpi strong{display:block;margin-top:16px;color:var(--mint);font:400 28px/1 var(--mono)}.money-limit{display:grid;grid-template-columns:1fr 1fr;gap:16px}.limit-form{border-left:1px solid var(--line);padding-left:16px}.limit-form label{display:block;color:var(--muted);font-size:9px}.limit-row{display:flex;margin-top:12px}.limit-row input,.range-tools input{min-width:0;border:1px solid var(--line-strong);outline:0;color:var(--mint);background:#070a08;color-scheme:dark}.limit-row input{width:112px;height:34px;padding:0 9px}.limit-row button{min-width:52px;height:34px;padding:0 10px;white-space:nowrap;border:1px solid var(--mint);color:var(--mint);background:transparent;cursor:pointer}.limit-help{display:block!important;margin-top:7px;font-size:8px!important}.save-state{color:var(--mint)!important}
      table{width:100%;border-collapse:collapse;min-width:850px;font-size:11px}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-weight:400}th:first-child,td:first-child{text-align:left}tbody tr:hover{background:rgba(155,242,199,.025)}.money{color:var(--amber)}.muted{color:var(--muted)}.error{color:var(--danger)}
      .range-tools{display:flex;align-items:center;gap:7px}.range-tools date-range-picker{width:276px}.range-tools button,.metric-tabs button{border:1px solid var(--line-strong);color:var(--muted);background:transparent;cursor:pointer}.range-tools button{height:34px}.metric-tabs{display:flex;gap:1px;margin-left:8px}.metric-tabs button{height:28px;padding:0 10px}.metric-tabs button[aria-pressed="true"]{border-color:var(--mint);color:var(--mint);background:rgba(155,242,199,.05)}
      .waterfall-wrap{min-width:720px;padding:12px 0 4px}.waterfall-scale{display:flex;justify-content:space-between;margin:0 0 14px 180px;color:var(--muted);font-size:9px}.waterfall-row{display:grid;grid-template-columns:160px minmax(0,1fr) 110px;align-items:center;gap:20px;min-height:44px;border-top:1px solid rgba(37,42,38,.7)}.waterfall-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.waterfall-label b{display:inline-block;width:28px;color:var(--muted);font-weight:400}.waterfall-track{height:12px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) 25%)}.waterfall-bar{height:100%;min-width:2px;background:linear-gradient(90deg,var(--mint),rgba(155,242,199,.42));box-shadow:0 0 14px rgba(155,242,199,.12);transform-origin:left;animation:grow .45s ease-out both}.waterfall-value{text-align:right;color:var(--mint)}.chart-empty{padding:50px;text-align:center;color:var(--muted)}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.money-limit{grid-column:span 2}}@media(max-width:760px){.intro{align-items:start;flex-direction:column}.panel-head.chart-head{align-items:flex-start;flex-wrap:wrap;padding:12px 14px}.panel-head.chart-head .push{width:100%;margin-left:0}.range-tools{flex-wrap:wrap}.shell{width:calc(100% - 20px)}.panel-body{padding:14px}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.money-limit{grid-column:auto}.chip.optional{display:none}}
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar"><div class="brand">MARK / EVENT OPS</div><div class="spacer"></div><span class="chip optional">ACCESS · SUPERADMIN</span><a class="chip" href="/">返回查询终端</a></nav>
      <header class="intro"><div><div class="kicker">Usage intelligence</div><h1>人员使用统计</h1></div><p>仅超级管理员可见。按日期审阅人员活跃、停留、导出与资源预算。</p></header>
      <section class="kpis"><div class="kpi"><span>ACTIVE USERS</span><strong id="userCount">—</strong></div><div class="kpi"><span>PAGE VIEWS</span><strong id="pageViews">—</strong></div><div class="kpi"><span>COST ESTIMATES</span><strong id="estimateCount">—</strong></div><div class="kpi"><span>EXPORTS</span><strong id="exportCount">—</strong></div><div class="kpi money-limit"><div><span>CONSUMED CNY</span><strong id="totalAmount">—</strong></div><form class="limit-form" id="limitForm"><label for="dailyLimit">DAILY / USER LIMIT</label><div class="limit-row"><input id="dailyLimit" type="number" min="0" max="1000000000" step="0.0001" required /><button type="submit">保存</button></div><span class="limit-help" id="limitState">0 表示不限制</span></form></div></section>
      <section class="panel"><header class="panel-head chart-head"><strong>User waterfall</strong><span>人员指标排名</span><div class="metric-tabs" role="group" aria-label="排名指标"><button type="button" data-metric="active_days" aria-pressed="true">活跃天数</button><button type="button" data-metric="stay_seconds" aria-pressed="false">总停留时间</button><button type="button" data-metric="consumed_amount_cny" aria-pressed="false">金额消耗</button></div><div class="range-tools push"><date-range-picker id="adminDateRange" aria-label="统计日期范围"></date-range-picker><button id="applyRange" type="button">应用筛选</button></div></header><div class="panel-body"><div id="waterfall"></div></div></section>
      <section class="panel"><header class="panel-head"><strong>User summary</strong><span>按账号汇总</span><span class="push" id="generatedAt">—</span></header><div class="panel-body"><table><thead><tr><th>账号</th><th>角色</th><th>活跃天数</th><th>访问次数</th><th>停留时间</th><th>询价次数</th><th>导出次数</th><th>消耗金额</th><th>最近访问</th></tr></thead><tbody id="userRows"></tbody></table></div></section>
      <section class="panel"><header class="panel-head"><strong>Recent visits</strong><span>筛选范围内最近访问</span><span class="push">LIMIT · 100</span></header><div class="panel-body"><table><thead><tr><th>账号</th><th>IP</th><th>开始时间</th><th>最后活动</th><th>停留时间</th></tr></thead><tbody id="visitRows"></tbody></table></div></section>
      <p class="error" id="error" aria-live="polite"></p>
    </main>
    <script>
      const $=(selector)=>document.querySelector(selector);const adminDateRange=$('#adminDateRange');let currentUsers=[];let currentMetric='active_days';
      const localDate=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      const formatTime=(value)=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—';
      const formatDuration=(seconds)=>{const total=Number(seconds||0);const hours=Math.floor(total/3600);const minutes=Math.floor((total%3600)/60);const rest=total%60;return hours?`${hours}h ${minutes}m`:minutes?`${minutes}m ${rest}s`:`${rest}s`};
      const appendCells=(target,values,classes=[])=>{const row=document.createElement('tr');values.forEach((value,index)=>{const cell=document.createElement('td');cell.textContent=value;cell.className=classes[index]||'';row.appendChild(cell)});target.appendChild(row)};
      function initializeRange(){const end=new Date();const start=new Date(end);start.setDate(start.getDate()-29);adminDateRange.setConstraints({maxDate:localDate(end)});adminDateRange.setRange(localDate(start),localDate(end))}
      function metricValue(item){return Number(item[currentMetric]||0)}
      function metricText(value){if(currentMetric==='stay_seconds')return formatDuration(value);if(currentMetric==='consumed_amount_cny')return `¥${value.toFixed(4)}`;return `${value} 天`}
      function renderWaterfall(){const root=$('#waterfall');root.replaceChildren();const ranked=[...currentUsers].sort((a,b)=>metricValue(b)-metricValue(a)).slice(0,15);if(!ranked.length||!ranked.some(metricValue)){root.innerHTML='<div class="chart-empty">所选日期内暂无可展示数据。</div>';return}const max=Math.max(...ranked.map(metricValue),1);const scale=document.createElement('div');scale.className='waterfall-scale';scale.innerHTML='<span>0</span><span>25%</span><span>50%</span><span>75%</span><span>MAX</span>';root.appendChild(scale);const wrap=document.createElement('div');wrap.className='waterfall-wrap';ranked.forEach((item,index)=>{const row=document.createElement('div');row.className='waterfall-row';const label=document.createElement('div');label.className='waterfall-label';label.innerHTML=`<b>${String(index+1).padStart(2,'0')}</b>`;label.append(document.createTextNode(item.username));const track=document.createElement('div');track.className='waterfall-track';const bar=document.createElement('div');bar.className='waterfall-bar';bar.style.width=`${Math.max(0.4,metricValue(item)/max*100)}%`;bar.style.animationDelay=`${index*25}ms`;track.appendChild(bar);const value=document.createElement('div');value.className='waterfall-value';value.textContent=metricText(metricValue(item));row.append(label,track,value);wrap.appendChild(row)});root.appendChild(wrap)}
      async function load(){try{$('#error').textContent='';const range=adminDateRange.getRange();if(!range)throw new Error('请选择有效的统计日期范围。');const params=new URLSearchParams({limit:'100',start_date:range.start,end_date:range.end});const response=await fetch(`/api/v1/admin/usage?${params}`);const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.detail||'统计数据读取失败。');currentUsers=payload.users||[];$('#userCount').textContent=currentUsers.filter(item=>item.active_days>0).length.toLocaleString();$('#pageViews').textContent=currentUsers.reduce((sum,item)=>sum+item.page_views,0).toLocaleString();$('#estimateCount').textContent=currentUsers.reduce((sum,item)=>sum+item.cost_estimate_count,0).toLocaleString();$('#exportCount').textContent=currentUsers.reduce((sum,item)=>sum+item.export_count,0).toLocaleString();$('#totalAmount').textContent=`¥${currentUsers.reduce((sum,item)=>sum+item.consumed_amount_cny,0).toFixed(4)}`;$('#dailyLimit').value=Number(payload.daily_user_limit_cny||0).toFixed(4);$('#generatedAt').textContent=`UPDATED · ${formatTime(payload.generated_at)}`;const userRows=$('#userRows');userRows.replaceChildren();currentUsers.forEach(item=>appendCells(userRows,[item.username,item.role,item.active_days,item.page_views.toLocaleString(),formatDuration(item.stay_seconds),item.cost_estimate_count.toLocaleString(),item.export_count.toLocaleString(),`¥${Number(item.consumed_amount_cny).toFixed(4)}`,formatTime(item.last_access_at)],['','','','','','','','money','muted']));const visitRows=$('#visitRows');visitRows.replaceChildren();(payload.recent_visits||[]).forEach(item=>appendCells(visitRows,[item.username,item.requester_ip||'—',formatTime(item.started_at),formatTime(item.last_seen_at),formatDuration(item.duration_seconds)],['','','muted','muted','']));renderWaterfall()}catch(error){$('#error').textContent=error.message||'统计数据读取失败。'}}
      document.querySelectorAll('[data-metric]').forEach(button=>button.addEventListener('click',()=>{currentMetric=button.dataset.metric;document.querySelectorAll('[data-metric]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));renderWaterfall()}));
      $('#applyRange').addEventListener('click',()=>{if(!adminDateRange.getRange()){$('#error').textContent='请选择有效的统计日期范围。';return}load()});
      $('#limitForm').addEventListener('submit',async(event)=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{const response=await fetch('/api/v1/admin/settings/daily-limit',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount_cny:Number($('#dailyLimit').value)})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.detail||'额度保存失败。');$('#dailyLimit').value=Number(payload.daily_user_limit_cny).toFixed(4);$('#limitState').textContent='已保存 · 对所有账号生效';$('#limitState').className='limit-help save-state'}catch(error){$('#error').textContent=error.message||'额度保存失败。'}finally{button.disabled=false}});
      initializeRange();load();
    </script>
  </body>
</html>
