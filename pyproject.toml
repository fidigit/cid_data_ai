[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-data-export"
version = "0.0.2"
description = "Internal self-service MaxCompute event data export service"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pyodps>=0.12,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
